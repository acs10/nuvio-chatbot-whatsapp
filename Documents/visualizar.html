<script>
  const docs = [{"id":"Documents/README.md","section":"Documentação","title":"Índice — Documentação","markdown":"# Documentação de engenharia — Nuvio\r\n\r\n| # | Documento | Conteúdo |\r\n| --- | --- | --- |\r\n| 1 | [Visão geral](01-visao-geral.md) | Produto, perfis, tecnologias, situação |\r\n| 2 | [WhatsApp e IA](02-whatsapp-e-ia.md) | Fluxo da mensagem, regras, IA (Claude), formas de conexão, **passo a passo para ativar com a Meta**, variáveis |\r\n| 3 | [Arquitetura e segurança](03-arquitetura-e-seguranca.md) | Camadas, ameaças e proteções, limites e evolução |\r\n| 4 | [Modelo de dados](04-modelo-de-dados.md) | Entidades, coleções do Firestore, transação e diff, cota gratuita |\r\n| 5 | [Publicação e operação](05-publicacao-e-operacao.md) | Netlify, `npm run env:push`, `npm run deploy`, ativar o WhatsApp real, operação |\r\n\r\nOs testes estão em [`../Testes`](../Testes/README.md). Visão geral do produto e das telas: [`../README.md`](../README.md).\r\n\r\n> **Situação (10/10/2026):** pronto para publicar. Ainda não hospedado (aguardando espaço na conta Netlify). Endereço previsto: `https://nuvio.netlify.app`.\r\n\r\n## Como visualizar os diagramas\r\n\r\n- **Mais fácil:** abra o arquivo [`visualizar.html`](visualizar.html) no navegador. Precisa de internet para carregar o desenhador.\r\n- No site publicado, a mesma página fica no **link secreto** `/documents/\u003ccódigo>` (veja [Publicação e operação](05-publicacao-e-operacao.md)).\r\n- No **GitHub**, os diagramas aparecem automaticamente.\r\n\r\nPara atualizar o `visualizar.html` e a página do site depois de editar algum `.md`, rode `npm run docs`.\r\n"},{"id":"Documents/01-visao-geral.md","section":"Documentação","title":"1. Visão geral","markdown":"# 1. Visão geral\r\n\r\n## 1.1 O produto\r\n\r\nA **Nuvio** é um SaaS: empresas assinam um plano e ganham um **assistente virtual no WhatsApp**, treinado com o conhecimento delas. A IA atende 24 horas. A equipe acompanha as conversas pelo painel, assume quando precisa e devolve para a IA.\r\n\r\n| Perfil | O que faz |\r\n| --- | --- |\r\n| **Visitante** | Conhece o produto e os planos; cria a conta (14 dias grátis) |\r\n| **Cliente (empresa)** | Configura o assistente, cadastra a base de conhecimento, conecta o WhatsApp, acompanha e assume conversas, gerencia plano e faturas |\r\n| **Backoffice Nuvio** | Acompanha MRR, clientes, assinaturas, operação (volume, conexões, alertas, integrações do servidor) e define preços e limites dos planos |\r\n| **Cliente final** | Conversa pelo WhatsApp (não acessa a Nuvio) |\r\n\r\n## 1.2 Tecnologias\r\n\r\n| Camada | Tecnologia |\r\n| --- | --- |\r\n| Interface | Next.js 16 · React 19 · TypeScript · MobX · CSS do design (Figma Make) + complementos |\r\n| Servidor | Rotas de API do Next.js |\r\n| Banco | **Firebase Firestore** (`nuvio-97b72`, São Paulo, plano gratuito), só pelo servidor |\r\n| WhatsApp | **WhatsApp Cloud API** (Meta): webhook assinado, envio, status, cadastro incorporado |\r\n| IA | **Claude** (Anthropic), com saída estruturada; motor local como reserva |\r\n| Testes | Vitest · Puppeteer · simulador local da Graph API |\r\n\r\n## 1.3 Situação (10/10/2026)\r\n\r\n| Item | Situação |\r\n| --- | --- |\r\n| Interface (site, cadastro, painel, backoffice) | ✅ |\r\n| Servidor, login (scrypt + cookie assinado), dados por empresa, Firestore | ✅ testado no Firestore real |\r\n| WhatsApp Cloud API (receber, responder, enviar, status, 24 h, erros) | ✅ pronto · testado com **simulador da Meta** · ⏳ teste com a Meta real pendente (ver [Testes/03](../Testes/03-whatsapp.md)) |\r\n| IA (Claude) | ✅ pronta · ativa ao configurar `ANTHROPIC_API_KEY` (sem chave: motor local) |\r\n| Pagamento das assinaturas | Demonstração (cartão e \"pagar\" simulados) |\r\n| Documentação e testes | ✅ esta pasta e [`../Testes`](../Testes/README.md) |\r\n| Publicação | ⏳ pronta (`npm run env:push` + `npm run deploy`), aguardando espaço no Netlify |\r\n\r\n## 1.4 Acesso de demonstração\r\n\r\nSenha `demo123`:\r\n- `mariana@lumina.com.br` (Clínica Lumina);\r\n- `admin@nuvio.com.br` (backoffice).\r\n\r\nNo site, o botão \"Ver demonstração\" entra direto.\r\n"},{"id":"Documents/02-whatsapp-e-ia.md","section":"Documentação","title":"2. WhatsApp (API oficial da Meta) e IA","markdown":"# 2. WhatsApp (API oficial da Meta) e IA\n\n## 2.1 Como uma mensagem é atendida\n\n```mermaid\nsequenceDiagram\n    actor C as Cliente final (WhatsApp)\n    participant M as Meta (WhatsApp Cloud API)\n    participant W as /api/webhooks/whatsapp\n    participant S as Servidor Nuvio\n    participant AI as IA (Claude)\n    participant DB as Firestore\n    C->>M: \"Quanto custa a avaliação?\"\n    M->>W: POST (assinado com X-Hub-Signature-256)\n    W->>W: confere a assinatura (META_APP_SECRET)\n    W->>S: identifica a empresa pelo phone_number_id\n    S->>DB: grava a mensagem (ignora se o wamid já existe)\n    S->>M: marca como lida (✓✓ azul)\n    S->>AI: instruções + base de conhecimento ativa + histórico\n    AI-->>S: { ação, resposta, fontes, assunto }\n    S->>DB: grava a resposta (status \"enviando\")\n    S->>M: POST /{phone_number_id}/messages\n    M-->>S: wamid\n    S->>DB: status \"enviada\"\n    M->>W: status entregue / lida / falhou\n    W->>DB: atualiza o status (nunca volta para trás)\n```\n\n**Regras que valem sempre (no nosso código, não na IA):**\n\n| Regra | Onde |\n| --- | --- |\n| Palavras que pedem atendente → transfere (ou avisa o horário fora do expediente) | `ai/responder.ts` + `bot/engine.ts` |\n| Depois de N respostas sem informação → transfere | idem |\n| Limite de conversas do plano atingido → IA pausa e a equipe é avisada | `PlatformStore.receiveMessage` |\n| Janela de 24 h: depois disso, só modelo (template) aprovado | `PlatformStore.sendAgentMessage` e erro 131047 da Meta |\n| Conversa com a equipe (assumida) → a IA não responde | `needsReply` |\n| Mensagem repetida (mesmo wamid) → ignorada | `PlatformStore.inbound` |\n| Conversas de demonstração → nunca são enviadas | `deliverPending` (status \"simulated\") |\n\n## 2.2 A IA\n\n- **Modelo:** Claude (Anthropic), `ANTHROPIC_MODEL` (padrão `claude-sonnet-5-5`).\n- **Entrada:** instruções do assistente (nome, tom, objetivo), **somente a base de conhecimento ativa** da empresa (até ~24 mil caracteres) e as últimas 20 mensagens.\n- **Saída estruturada** (ferramenta `responder`): ação (`answer`, `fallback`, `handoff`), texto, ids das fontes e assunto. O servidor confere tudo: ação válida, texto não vazio e fontes que existem.\n- **Proteções no prompt:**\n  - responder só com a base;\n  - não pedir senha nem cartão;\n  - ignorar pedidos do cliente para mudar as regras (injeção de prompt).\n- **Sem chave ou se a IA falhar:** volta para o motor local (busca na base com sinônimos). O atendimento não para.\n\n## 2.3 Formas de conectar o número\n\n| Forma | Para quê | Como |\n| --- | --- | --- |\n| **Simulada** | Demonstração, sem chaves da Meta | Painel → Integrações → Conectar (demonstração): número + código de 6 dígitos |\n| **Manual** | Número de **teste** da Meta, ou empresa que já tem token de usuário do sistema | Painel → Integrações → Conexão manual: Phone number ID + token (validados na Meta e guardados **cifrados**) |\n| **Cadastro incorporado** | Produção: cada cliente conecta o próprio número em poucos cliques | Botão \"Conectar com o Facebook\" (SDK da Meta) → código → token, inscrição do app na WABA e registro do número |\n\n## 2.4 Como ativar com a Meta (passo a passo)\n\n**Teste gratuito (sem contrato e sem verificação da empresa):**\n\n1. Em **developers.facebook.com**: Meus apps → **Criar app** → tipo **Empresa** → adicionar o produto **WhatsApp**.\n2. Em **WhatsApp → Configuração da API**, a Meta dá um **número de teste** e um **token temporário** (24 h). Cadastre até **5 celulares** que poderão receber mensagens.\n3. Em **Configurações do app → Básico**, copie a **Chave secreta do app**.\n4. No servidor da Nuvio (variáveis do Netlify), configure:\n   - `META_APP_SECRET`: a chave secreta;\n   - `WHATSAPP_VERIFY_TOKEN`: um texto qualquer, combinado no passo 5.\n5. Em **WhatsApp → Configuração → Webhook**:\n   - URL: `https://\u003csite>/api/webhooks/whatsapp`;\n   - token de verificação: o mesmo texto do `WHATSAPP_VERIFY_TOKEN`;\n   - inscreva o campo **messages**.\n6. No painel da Nuvio, como cliente: **Integrações → Conexão manual** → Phone number ID + token.\n7. Mande \"Quanto custa?\" de um dos celulares cadastrados para o número de teste. A resposta da IA deve chegar, e o painel mostra a conversa com ✓ e ✓✓.\n\n**Produção (clientes reais):**\n\n1. Verificação da empresa na Meta (Business Manager).\n2. Revisão do app para a permissão `whatsapp_business_management` / `whatsapp_business_messaging`.\n3. Configurar o **Cadastro incorporado** (Facebook Login for Business → configuração do tipo WhatsApp) e definir:\n   - `META_APP_ID`;\n   - `META_CONFIG_ID`.\n4. Modelos (templates) aprovados para mensagens fora da janela de 24 h.\n5. Cobrança da Meta por conversa (marketing/utilidade/autenticação/serviço) — considerar no preço dos planos.\n\n## 2.5 Variáveis de ambiente\n\n| Variável | Obrigatória | Para quê |\n| --- | --- | --- |\n| `META_APP_SECRET` | Para o WhatsApp real | Confere a assinatura dos webhooks e troca o código do cadastro incorporado |\n| `WHATSAPP_VERIFY_TOKEN` | Para o WhatsApp real | Verificação do webhook |\n| `META_APP_ID`, `META_CONFIG_ID` | Para o cadastro incorporado | Botão \"Conectar com o Facebook\" |\n| `META_GRAPH_VERSION` | Não (padrão v23.0) | Versão da Graph API |\n| `META_GRAPH_BASE` | **Só em testes** | Aponta para o simulador da Meta (`tests/e2e/whatsapp.mjs`) |\n| `ANTHROPIC_API_KEY`, `ANTHROPIC_MODEL` | Para a IA | Respostas com Claude |\n| `FIREBASE_*`, `SESSION_SECRET`, `VAULT_KEY` | Sim (produção) | Banco, sessão e cifra dos tokens do WhatsApp |\n"},{"id":"Documents/03-arquitetura-e-seguranca.md","section":"Documentação","title":"3. Arquitetura e segurança","markdown":"# 3. Arquitetura e segurança\n\n## 3.1 Camadas\n\n```mermaid\nflowchart TB\n    subgraph APP[\"app/\"]\n        P[\"páginas: site, /comecar, /entrar, /painel, /admin\"]\n        A[\"/api/state · /api/command · /api/auth/*\"]\n        W[\"/api/webhooks/whatsapp · /api/whatsapp/* · /api/assistant/test\"]\n    end\n    subgraph MOD[\"modules/\"]\n        PS[\"platform: PlatformStore (regras) · PlatformProvider (sincronização)\"]\n        AC[\"access: views (o que cada perfil vê) · commands (quem pode o quê)\"]\n        SV[\"server: Firestore · versão/diff · sessão · segredos\"]\n        WA[\"whatsapp: webhook · cloud-api · whatsapp-service\"]\n        AI[\"ai: claude · responder\"]\n        BOT[\"bot: motor local\"]\n    end\n    FS[(Firestore)]\n    META[(Meta · WhatsApp)]\n    CL[(Anthropic · Claude)]\n    APP --> MOD\n    SV --> FS\n    WA --> META\n    AI --> CL\n```\n\n**Mesmo desenho do KreativeArt:** a tela executa a regra na hora, e o servidor repete a mesma ação, com o perfil da sessão e os mesmos ids, gravando só o que mudou numa transação com controle de versão. O que muda na Nuvio: as **respostas da IA e os envios ao WhatsApp acontecem no servidor, depois** da ação (`afterChange`), porque dependem de serviços externos.\n\n## 3.2 Segurança\n\n| # | Ameaça | Proteção | Teste |\n| --- | --- | --- | --- |\n| S1 | Senhas roubadas | scrypt com sal; hash nunca sai do servidor | API-02/03 |\n| S2 | Empresa ver/alterar dados de outra | Visão por perfil (`views.ts`) e dono conferido em cada ação (`commands.ts`) | API-03/05, UT-08 |\n| S3 | Backoffice ler conversas dos clientes finais | O backoffice recebe só números agregados | API-04 |\n| S4 | Webhook falso (alguém fingindo ser a Meta) | Assinatura **X-Hub-Signature-256** com `META_APP_SECRET`, sobre o corpo bruto | WA-03, UT-05 |\n| S5 | Mensagem repetida/reenviada | Deduplicação pelo `wamid` | WA-05 |\n| S6 | Vazamento do token do WhatsApp | Token validado na Meta, guardado **cifrado** (AES-256-GCM, `VAULT_KEY`) numa coleção só do servidor; nunca vai ao navegador | WA-02, UT-08 |\n| S7 | Injeção de prompt (\"ignore as regras…\") | Instrução explícita no prompt + regras críticas aplicadas pelo código + saída estruturada conferida | UT-07 |\n| S8 | IA inventar informação | Prompt \"somente com a base\"; fontes conferidas; ação `fallback` / transferência após N falhas | UT-07 |\n| S9 | CSRF | Alterações só com `Origin` do próprio site + JSON + cookie SameSite | API-06 |\n| S10 | Simular mensagens em conversas reais | Simulação só em conversas marcadas como demonstração | commands |\n| S11 | Envio para clientes fora da janela de 24 h | Bloqueado no painel; erro 131047 da Meta tratado | WA-08, UT-06 |\n\n## 3.3 Limites conhecidos e evolução\n\n| Item | Hoje | Evolução |\n| --- | --- | --- |\n| Escala das conversas | Todos os dados ficam num estado versionado (bom para portfólio e dezenas de empresas) | Conversas em coleção por empresa, com consultas e paginação |\n| Fila de envio | Envio na mesma requisição (webhook/ação) | Fila com novas tentativas (ex.: tarefas agendadas) |\n| Modelos (templates) | Envio pronto em `cloud-api.sendTemplate`, sem tela | Tela de modelos e sincronização com a Meta |\n| Mídia (áudio, imagem) | Vira aviso para a equipe | Baixar a mídia e transcrever áudio |\n| Pagamento das assinaturas | Simulado | Gateway (Mercado Pago/Stripe), como no KreativeArt |\n"},{"id":"Documents/04-modelo-de-dados.md","section":"Documentação","title":"4. Modelo de dados","markdown":"# 4. Modelo de dados\n\n## Entidades\n\n```mermaid\nerDiagram\n    PLAN ||--o{ WORKSPACE : \"assinado por\"\n    WORKSPACE ||--o{ USER : \"equipe\"\n    WORKSPACE ||--o{ KNOWLEDGE : \"base\"\n    WORKSPACE ||--o{ CONVERSATION : \"atende\"\n    WORKSPACE ||--o{ INVOICE : \"cobrado em\"\n    WORKSPACE ||--o| PRIVATE_TOKEN : \"token cifrado\"\n    CONVERSATION ||--|{ MESSAGE : \"contém\"\n    PLAN {\n        string id \"essencial profissional escala\"\n        number price\n        number conversations \"limite por mês\"\n        number knowledgeLimit\n    }\n    WORKSPACE {\n        string id\n        string name\n        string planId\n        string status \"trial active past_due suspended cancelled\"\n        object whatsapp \"status telefone modo phoneNumberId\"\n        object assistant \"nome tom saudação horário regras\"\n        object integrations\n        array daily \"uso por dia\"\n    }\n    USER {\n        string id\n        string email\n        string role \"client ou admin\"\n        string passwordHash \"scrypt\"\n    }\n    KNOWLEDGE {\n        string id\n        string kind \"faq text document site\"\n        string title\n        string content\n        boolean active\n    }\n    CONVERSATION {\n        string id\n        string phone\n        string status \"IA atendimento aguardando resolvida\"\n        string topic\n        boolean demo \"simulada\"\n    }\n    MESSAGE {\n        string id\n        string from \"cliente IA equipe sistema\"\n        string text\n        string externalId \"wamid da Meta\"\n        string status \"pending sent delivered read failed simulated\"\n    }\n    INVOICE {\n        string id\n        number amount\n        string status\n    }\n    PRIVATE_TOKEN {\n        string workspaceId\n        string token \"AES-256-GCM\"\n    }\n```\n\n## Coleções do Firestore\n\n| Coleção | Conteúdo | Quem lê |\n| --- | --- | --- |\n| `plans` | Planos e preços | Todos |\n| `workspaces` | Empresas: plano, situação, WhatsApp, assistente, uso diário | A própria empresa; o backoffice (sem conversas) |\n| `users` | Pessoas com acesso (hash scrypt da senha) | Só o servidor (o hash nunca é enviado) |\n| `knowledge` | Base de conhecimento de cada empresa | A própria empresa |\n| `conversations` | Conversas com as mensagens | A própria empresa |\n| `invoices` | Faturas das assinaturas | A empresa e o backoffice |\n| `meta` | Documento `state`: configurações, histórico de receita e **versão** dos dados | Só o servidor |\n| `private` | Tokens do WhatsApp de cada empresa, **cifrados** (AES-256-GCM com `VAULT_KEY`) | Só o servidor |\n\n## Como uma alteração é gravada\n\n```mermaid\nsequenceDiagram\n    participant T as Tela\n    participant S as Servidor\n    participant F as Firestore\n    T->>S: POST /api/command (ação, argumentos, ids)\n    S->>F: transação: lê meta/state (versão) e os dados\n    S->>S: executa a MESMA regra da tela, com o perfil da sessão\n    S->>S: compara antes × depois (diff)\n    S->>F: grava só os documentos que mudaram + versão + 1\n    S-->>T: estado oficial (visão do perfil)\n```\n\n- **Transação:** se duas pessoas alteram ao mesmo tempo, o Firestore refaz a transação com os dados novos.\n- **Diff:** só os documentos alterados são gravados. Isso economiza a cota gratuita (plano Spark: 20 mil gravações por dia).\n- **No computador:** com `DATA_STORE=file`, os mesmos dados ficam em `.data/nuvio.json`, com as mesmas regras. É assim que os testes rodam sem gastar a cota.\n\n## Criar ou restaurar os dados\n\n```bash\nnpm run db:setup\n```\n\nO comando cria `SESSION_SECRET` e `VAULT_KEY` no `.env.local`, se ainda não existirem, e grava a demonstração no Firestore: empresas de exemplo, a Clínica Lumina com conversas e o backoffice.\n\n> Rode o comando só quando precisar restaurar os dados: cada execução consome gravações da cota gratuita.\n"},{"id":"Documents/05-publicacao-e-operacao.md","section":"Documentação","title":"5. Publicação e operação","markdown":"# 5. Publicação e operação\n\n## O que é preciso\n\n| Item | Situação |\n| --- | --- |\n| Conta Netlify | A mesma dos outros projetos. Precisa de créditos/espaço disponível |\n| Firebase | ✅ Projeto `nuvio-97b72` (plano gratuito Spark), já com a demonstração |\n| Chave do Firebase | ✅ `firebase-service-account.json` na pasta (fora do Git; **nunca** publicar) |\n| `SESSION_SECRET`, `VAULT_KEY` | ✅ No `.env.local` (criados pelo `npm run db:setup`) |\n| Chaves da Meta e da Anthropic | Opcionais. Sem elas, o site funciona com WhatsApp **simulado** e o motor local de respostas |\n| Node | 22 (fixado no `netlify.toml`) |\n\n## Primeira publicação\n\nNa pasta do projeto, em ordem:\n\n1. Criar o site e ligar a pasta a ele (uma vez):\n\n```bash\nnpx netlify-cli sites:create --name nuvio\n```\n\n2. Enviar as variáveis de produção, **sem mostrar os valores** na tela (uma vez, e de novo se alguma chave mudar):\n\n```bash\nnpm run env:push\n```\n\n3. Publicar (agora e nas próximas vezes):\n\n```bash\nnpm run deploy\n```\n\n**Sobre as variáveis (`scripts/push-env.mjs`):**\n\n- O que ele lê:\n  - do `.env.local`: `SESSION_SECRET`, `VAULT_KEY` e, se existirem, as chaves da Meta e da Anthropic;\n  - do `firebase-service-account.json`: só os três campos necessários (`FIREBASE_PROJECT_ID`, `FIREBASE_CLIENT_EMAIL`, `FIREBASE_PRIVATE_KEY`), que cabem no limite de 4 KB das funções.\n- Como envia: grava tudo num arquivo temporário, importa no Netlify e apaga o arquivo. Na tela aparecem só os nomes.\n\n**Sobre a publicação (`scripts/deploy.mjs`):**\n\n1. Tira da pasta, durante o build, a chave do Firebase, os `.env*` e o `.data/`. Sem isso, o adaptador do Next copiaria esses arquivos para dentro da função.\n2. Publica como rascunho e promove a versão para o endereço principal. Esse caminho funciona mesmo sem créditos para `deploy --prod`.\n3. Devolve os arquivos para a pasta, mesmo se algo der errado.\n\n**Depois de publicar:**\n\n- **Acesso público:** se o site abrir pedindo login do Netlify, desligue a proteção de visitantes em *Site configuration → Access & security*.\n- **Documentação:** fica em `https://nuvio.netlify.app/documents/\u003ccódigo>`. O código está em `src/modules/docs/docs-access.ts`.\n\n## Ativar o WhatsApp real\n\nSiga o passo a passo em [02 · WhatsApp e IA](02-whatsapp-e-ia.md#24-como-ativar-com-a-meta-passo-a-passo).\n\n- **URL do webhook** a informar à Meta: `https://nuvio.netlify.app/api/webhooks/whatsapp`. Ela também aparece em *Painel → Integrações*.\n- Depois de colocar as chaves da Meta no `.env.local`, rode `npm run env:push` e `npm run deploy`.\n- Em seguida, execute o roteiro META-01 a META-08 em [Testes/03](../Testes/03-whatsapp.md).\n\n## Conferir em produção\n\n```bash\nnpm run test:api -- https://nuvio.netlify.app\n```\n\n```bash\nnpm run test:smoke -- https://nuvio.netlify.app\n```\n\n> Os fluxos completos (`test:flows`) criam uma empresa de teste no Firestore. Rode-os em produção só se for restaurar a demonstração depois (`npm run db:setup`).\n\n## Operação\n\n| Tarefa | Como |\n| --- | --- |\n| Restaurar a demonstração | `npm run db:setup` (consome cota do Firestore; evite repetir) |\n| Atualizar a documentação | Edite os `.md` → `npm run docs` → `npm run deploy` |\n| Trocar o link da documentação | Mude o código em `docs-access.ts` e publique |\n| Ver erros | Netlify → *Logs → Functions* · Painel do backoffice → \"Status das integrações\" |\n| Trocar uma chave | Edite o `.env.local` → `npm run env:push` → `npm run deploy` |\n| Uso do Firestore | Console do Firebase → *Usage* (plano Spark: 50 mil leituras e 20 mil gravações por dia) |\n"},{"id":"Testes/README.md","section":"Testes","title":"Índice — Testes","markdown":"# Testes — Nuvio\n\n**Última execução:** 10/10/2026 · **Resultado geral:** ✅ aprovado (local) · ⏳ teste com a Meta real e produção após a publicação\n\n## Resumo\n\n| Nível | Documento | Casos | Resultado |\n| --- | --- | --- | --- |\n| Unitários (automatizados) | [01-unitarios.md](01-unitarios.md) | 28 | ✅ 28/28 |\n| Ponta a ponta (navegador real) | [02-ponta-a-ponta.md](02-ponta-a-ponta.md) | 9 fluxos + 34 páginas | ✅ 9/9 · 34/34 |\n| WhatsApp (simulador da Meta + roteiro real) | [03-whatsapp.md](03-whatsapp.md) | 10 + 8 | ✅ 10/10 · ⏳ Meta real |\n| API e segurança | [04-api-e-seguranca.md](04-api-e-seguranca.md) | 7 | ✅ 7/7 |\n| Produção (Netlify + Firestore) | [05-producao.md](05-producao.md) | roteiro pronto | ⏳ após publicar |\n| Incidentes | [06-incidentes.md](06-incidentes.md) | 8 | ✅ resolvidos |\n\nAs saídas brutas de cada execução estão em [`resultados/`](resultados/).\n\n## Estratégia\n\n```mermaid\nflowchart LR\n    U[\"Unitários · Vitest · 28\u003cbr/>robô, regras, webhook,\u003cbr/>IA, acesso, cifra\"] --> E[\"Ponta a ponta · Puppeteer\u003cbr/>9 fluxos + 34 páginas\u003cbr/>cadastro → base → conversa\u003cbr/>→ cobrança → backoffice\"]\n    E --> W[\"WhatsApp · 10\u003cbr/>simulador da Graph API\u003cbr/>+ webhooks assinados\"]\n    W --> A[\"API e segurança · 7\u003cbr/>perfis, empresas,\u003cbr/>CSRF, integrações\"]\n    A --> P[\"Produção\u003cbr/>nuvio.netlify.app\u003cbr/>+ Meta real\"]\n```\n\n**Banco nos testes:**\n\n- **Primeira rodada:** os fluxos, a API e as páginas foram aprovados no **Firestore real** (projeto `nuvio-97b72`).\n- **Rodada registrada em `resultados/`:** feita com o banco local (`DATA_STORE=file`), que tem as mesmas regras. Assim os testes não gastam a cota gratuita nem deixam empresas de teste nos dados do portfólio.\n\n## Como rodar de novo\n\nNa pasta do projeto:\n\n```bash\nnpm test\n```\n\nCom o site rodando com banco local (configuração `nuvio-testes` do `.claude/launch.json`, porta 3016), em outro terminal:\n\n```bash\nnpm run test:flows -- http://localhost:3016\n```\n\n```bash\nnpm run test:api -- http://localhost:3016\n```\n\n```bash\nnpm run test:smoke -- http://localhost:3016\n```\n\nWhatsApp: suba o site com as variáveis do simulador (configuração `nuvio-whatsapp`; `node tests/e2e/whatsapp.mjs --env` mostra quais são) e rode:\n\n```bash\nnpm run test:whatsapp -- http://localhost:3016\n```\n\n## Não testado (depende de serviços externos)\n\n| Item | Por quê |\n| --- | --- |\n| WhatsApp com a Meta real | Depende de criar o app na Meta (gratuito). Roteiro META-01 a META-08 em [03-whatsapp.md](03-whatsapp.md) |\n| IA com a Claude real | Depende de `ANTHROPIC_API_KEY`. Sem chave, o motor local responde (testado). O formato da resposta da IA é conferido em UT-07 |\n| Pagamento das assinaturas | Simulado nesta versão |\n"},{"id":"Testes/01-unitarios.md","section":"Testes","title":"1. Testes unitários","markdown":"# 1. Testes unitários\n\n**Ferramenta:** Vitest · **Arquivos:** `tests/unit/platform.test.ts`, `tests/unit/server.test.ts` · **Resultado:** ✅ 28/28 · saída: [resultados/unitarios-vitest.txt](resultados/unitarios-vitest.txt)\n\n```bash\nnpm test\n```\n\n| # | Grupo | Caso | Resultado |\n| --- | --- | --- | --- |\n| 1 | UT-01 Entendimento das perguntas | Normaliza acentos, ignora palavras vazias e une sinônimos | ✅ |\n| 2 | UT-01 | Classifica o assunto da conversa | ✅ |\n| 3 | UT-01 | Encontra a resposta certa na base, inclusive dentro de textos longos | ✅ |\n| 4 | UT-01 | Não usa conteúdo desativado ou ainda em leitura | ✅ |\n| 5 | UT-02 Regras do assistente | Responde pela base com o tom escolhido e cita a fonte | ✅ |\n| 6 | UT-02 | Cumprimenta pelo nome | ✅ |\n| 7 | UT-02 | Transfere quando o cliente pede atendente, ou avisa o horário fora do expediente | ✅ |\n| 8 | UT-02 | Depois de N respostas sem informação, transfere para a equipe | ✅ |\n| 9 | UT-03 Conversas e atendimento humano | Conversa simulada: a IA responde, conta no uso do dia, a equipe assume, responde, devolve e encerra | ✅ |\n| 10 | UT-03 | Pedido de atendente coloca a conversa em espera para a equipe | ✅ |\n| 11 | UT-04 Base, integrações, cobrança, backoffice | Valida conteúdos e respeita o limite do plano | ✅ |\n| 12 | UT-04 | Conecta o WhatsApp em duas etapas | ✅ |\n| 13 | UT-04 | Fatura vencida deixa a conta com pagamento pendente; pagar regulariza | ✅ |\n| 14 | UT-04 | Cadastro cria empresa em teste grátis; backoffice exige perfil admin | ✅ |\n| 15 | UT-04 | Demonstração: a Lumina tem conversas montadas pelo próprio motor do robô | ✅ |\n| 16 | UT-05 Webhook do WhatsApp | Lê texto, botões e mídia; ignora reações | ✅ |\n| 17 | UT-05 | Lê status de entrega e erros | ✅ |\n| 18 | UT-05 | Assinatura X-Hub-Signature-256 confere com o segredo do app | ✅ |\n| 19 | UT-06 Conversas reais | Mensagem nova abre conversa; repetida é ignorada; mesma pessoa continua na mesma conversa | ✅ |\n| 20 | UT-06 | Status de entrega só avança; falha registra o motivo | ✅ |\n| 21 | UT-06 | Regra das 24 h e limite do plano | ✅ |\n| 22 | UT-06 | No servidor, a resposta vem depois (sem resposta automática no navegador) | ✅ |\n| 23 | UT-07 IA (Claude) | Instruções levam só a base ATIVA e as regras de segurança | ✅ |\n| 24 | UT-07 | Histórico: começa pelo cliente, junta mensagens seguidas e ignora avisos do sistema | ✅ |\n| 25 | UT-07 | Confere a resposta da IA: ação válida, texto e fontes que existem | ✅ |\n| 26 | UT-08 Acesso e gravação no servidor | Cada perfil recebe só o que pode | ✅ |\n| 27 | UT-08 | Recusa ações em outra empresa | ✅ |\n| 28 | UT-08 | Grava só o que mudou; token cifrado não é legível | ✅ |\n"},{"id":"Testes/02-ponta-a-ponta.md","section":"Testes","title":"2. Testes ponta a ponta","markdown":"# 2. Testes ponta a ponta\n\n**Ferramenta:** Puppeteer + Google Chrome (sem janela) · **Resultado:** ✅ 9/9 fluxos · ✅ 34/34 páginas (+ página Integrações com as chaves da Meta configuradas)\n\nSaídas: [resultados/fluxos.txt](resultados/fluxos.txt) · [resultados/paginas.txt](resultados/paginas.txt)\n\n## Fluxos completos (`tests/e2e/flows.mjs`)\n\nO robô usa o site como uma pessoa. Um erro de JavaScript em qualquer página reprova o teste.\n\n| # | Fluxo | O que comprova | Resultado |\n| --- | --- | --- | --- |\n| F-01 | Cadastro em 4 etapas | Empresa \"Padaria Pão Quente\" criada no servidor, plano Essencial, teste grátis, aviso para conectar o WhatsApp | ✅ |\n| F-02 | Base de conhecimento | Pergunta e texto adicionados e ativos | ✅ |\n| F-03 | Testar o assistente | Responde pela base (FAQ e texto) e transfere quando pedem atendente (pelo servidor: mesma IA do WhatsApp) | ✅ |\n| F-04 | Configurar o assistente | Mensagem curta recusada; nova saudação salva | ✅ |\n| F-05 | Conversa | IA responde → equipe assume, responde → encerra | ✅ |\n| F-06 | Integrações | Conecta o WhatsApp (modo demonstração) em 2 etapas | ✅ |\n| F-07 | Cobrança | Cadastra cartão, ativa a assinatura e muda para o Profissional | ✅ |\n| F-08 | Backoffice | Encontra o novo cliente e suspende; cliente suspenso não entra | ✅ |\n| F-09 | Site | \"Ver demonstração\" abre o painel da Clínica Lumina | ✅ |\n\n## Todas as páginas (`tests/e2e/smoke.mjs`)\n\nAbre cada página como visitante, cliente e backoffice e registra qualquer erro do navegador.\n\n| Rodada | Resultado |\n| --- | --- |\n| Computador (1366×900) | ✅ 17/17 |\n| Celular (375×812) | ✅ 17/17 |\n| Computador, **com as chaves da Meta configuradas** | ✅ 17/17, depois da correção do incidente I-08 ([06-incidentes](06-incidentes.md)) |\n"},{"id":"Testes/03-whatsapp.md","section":"Testes","title":"3. WhatsApp","markdown":"# 3. WhatsApp\n\n## Com o simulador da Meta — ✅ 10/10\n\n**Como funciona o teste:** `tests/e2e/whatsapp.mjs` sobe um servidor que **imita a Graph API**:\n- mesmos endereços (`/v23.0/{phone_number_id}`, `/messages`);\n- mesmas respostas;\n- mesmos códigos de erro (190, 100, 131047).\n\nO próprio script faz o papel da Meta, enviando **webhooks assinados**.\n\nSaída: [resultados/whatsapp-simulado.txt](resultados/whatsapp-simulado.txt)\n\n| ID | Verificação | Resultado |\n| --- | --- | --- |\n| WA-01 | Verificação do webhook (`hub.challenge`): token errado 403, certo devolve o challenge | ✅ |\n| WA-02 | Conexão manual: token validado na \"Meta\", guardado cifrado, nunca volta ao navegador | ✅ |\n| WA-03 | Webhook sem assinatura ou com assinatura errada → 401, nada gravado | ✅ |\n| WA-04 | Mensagem nova → conversa criada → IA responde pela base → enviada pela API (wamid) | ✅ |\n| WA-05 | Notificação repetida não duplica | ✅ |\n| WA-06 | Status enviado → entregue → lida (fora de ordem é ignorado) | ✅ |\n| WA-07 | Pedido de atendente → transferência; equipe responde pela API | ✅ |\n| WA-08 | Erro 131047 (fora das 24 h) aparece na mensagem e no painel | ✅ |\n| WA-09 | Áudio vira aviso para a equipe; número de outra conta é ignorado | ✅ |\n| WA-10 | Desconectar apaga o token; nada mais é enviado | ✅ |\n\n## ⏳ Com a Meta real — pendente\n\n**Não realizado ainda:** depende de criar o app na Meta (gratuito) e configurar as variáveis.\n\n**É viável:**\n- A Meta oferece um número de teste gratuito, que envia mensagens para até 5 celulares cadastrados, sem contrato nem verificação da empresa.\n- O código é o mesmo testado com o simulador. Muda só o endereço da API (`META_GRAPH_BASE` vazio).\n\n**Roteiro:**\n- Passo a passo de configuração: [Documents/02 · 2.4](../Documents/02-whatsapp-e-ia.md#24-como-ativar-com-a-meta-passo-a-passo).\n- Publicação: [Documents/05](../Documents/05-publicacao-e-operacao.md#ativar-o-whatsapp-real).\n\n| ID | O que testar | Resultado esperado |\n| --- | --- | --- |\n| META-01 | Salvar a URL do webhook no painel da Meta | A Meta confirma a verificação |\n| META-02 | Conexão manual com o número de teste | Painel mostra \"API oficial · conexão manual\" |\n| META-03 | Mandar \"Quanto custa?\" de um celular cadastrado | Resposta da IA chega no celular; painel mostra ✓ → ✓✓ → ✓✓ azul |\n| META-04 | Mandar \"quero falar com um atendente\" e responder pelo painel | Mensagem da equipe chega no celular |\n| META-05 | Mandar áudio/imagem | Painel mostra o aviso; IA não responde |\n| META-06 | Responder depois de 24 h | Painel bloqueia e explica a regra |\n| META-07 | Token temporário expirado (24 h) | Painel mostra \"Token expirado…\" (erro 190) |\n| META-08 | Com `ANTHROPIC_API_KEY`: respostas da IA | Texto natural, fontes da base |\n\n**Riscos a observar no teste real:**\n- formato do número brasileiro (o WhatsApp às vezes informa o celular sem o 9º dígito);\n- atraso dos webhooks de status;\n- limites de envio do número de teste.\n"},{"id":"Testes/04-api-e-seguranca.md","section":"Testes","title":"4. API e segurança","markdown":"# 4. API e segurança\n\n**Ferramenta:** `tests/e2e/api-security.mjs` (chamadas HTTP diretas, sem as telas) · **Resultado:** ✅ 7/7 · saída: [resultados/api-seguranca.txt](resultados/api-seguranca.txt)\n\n```bash\nnpm run test:api -- http://localhost:3016\n```\n\n| ID | Verificação | Esperado | Resultado |\n| --- | --- | --- | --- |\n| API-01 | Visitante lê o estado | Só os 3 planos; nenhuma empresa, usuário, conversa ou fatura | ✅ |\n| API-02 | Login | Senha errada → 401; cookie HttpOnly + SameSite=Lax | ✅ |\n| API-03 | Cada empresa vê só os próprios dados | A Aurora não vê nada da Lumina; ninguém recebe hash de senha | ✅ |\n| API-04 | Backoffice | Vê empresas e faturas, mas **nenhuma conversa** dos clientes finais | ✅ |\n| API-05 | Ações em outra empresa ou fora do perfil | 8 tentativas recusadas (422); sem login 401; ação inexistente 400 | ✅ |\n| API-06 | CSRF | Sem origem → 403; de outro site → 403 | ✅ |\n| API-07 | Simulação e integrações | Simular mensagens só em conversas de demonstração; sem chaves da Meta, conexão real e webhook → 404 | ✅ |\n\nAs proteções de cada ameaça estão em [Documents/03 · 3.2](../Documents/03-arquitetura-e-seguranca.md#32-segurança). As do webhook (assinatura, repetição) são testadas em [03-whatsapp.md](03-whatsapp.md).\n"},{"id":"Testes/05-producao.md","section":"Testes","title":"5. Produção (roteiro)","markdown":"# 5. Produção (roteiro)\n\n**Situação:** ⏳ aguardando a publicação no Netlify. O roteiro abaixo está pronto para rodar logo depois de `npm run env:push` e `npm run deploy` ([Documents/05](../Documents/05-publicacao-e-operacao.md)).\n\n| # | Verificação | Como | Esperado |\n| --- | --- | --- | --- |\n| P-01 | Site abre para qualquer pessoa | Abrir `https://nuvio.netlify.app` numa janela anônima | Página inicial (sem tela de login do Netlify) |\n| P-02 | Firestore conectado | Painel do backoffice → \"Status das integrações\" | Banco: Firestore |\n| P-03 | API e segurança | `npm run test:api -- https://nuvio.netlify.app` | 7/7 |\n| P-04 | Todas as páginas | `npm run test:smoke -- https://nuvio.netlify.app` (e com `MOBILE=1`) | Sem erros |\n| P-05 | Cabeçalhos | `curl -I https://nuvio.netlify.app` | CSP, `X-Frame-Options: DENY`, `nosniff` |\n| P-06 | Documentação | Link `/documents/\u003ccódigo>` + `node tests/e2e/docs-check.mjs \u003clink>` | Todos os diagramas desenhados; outro código → 404 |\n| P-07 | Arquivos locais fora da função | Netlify → *Deploys → Functions* | Sem `firebase-service-account.json`, `.env*` nem `.data/` |\n| P-08 | WhatsApp real | Roteiro META-01 a META-08 em [03-whatsapp.md](03-whatsapp.md) | — |\n\nAo executar, salve as saídas em `resultados/` (`producao-api.txt`, `producao-paginas.txt`) e atualize esta página e o [README](README.md).\n"},{"id":"Testes/06-incidentes.md","section":"Testes","title":"6. Incidentes","markdown":"# 6. Incidentes\n\nProblemas encontrados pelos testes durante o desenvolvimento e como foram resolvidos.\n\n| # | Encontrado por | Problema | Causa | Solução |\n| --- | --- | --- | --- | --- |\n| I-01 | Fluxos | A tela travava ao ligar a ponte com o servidor | O `Proxy` sobre a store do MobX violava uma regra do JavaScript (métodos travados pelo MobX) | O alvo do `Proxy` passou a ser um objeto vazio com o protótipo da store |\n| I-02 | Fluxos | Erro ao abrir uma conversa | `scrollIntoView` devolvia uma Promise dentro do `useEffect` (função de limpeza inválida) | Chaves no corpo da função |\n| I-03 | Unitários | O uso do dia não aumentava em algumas conversas | Cópia de um objeto do MobX na função `bump` | Buscar o objeto de novo depois de incluir |\n| I-04 | Unitários | O robô não entendia \"multa\" ou \"faltar\" | Sinônimos ausentes | Sinônimos incluídos no motor local |\n| I-05 | Fluxos | \"Simular mensagem\" mostrava erro mesmo funcionando | A ação devolve o id (texto), e a ponte tratava todo texto como mensagem de erro | Resultado da ação embrulhado e conferido pelo tipo |\n| I-06 | API | Desconectar o WhatsApp falhava pelo servidor | Número de argumentos diferente entre a tela e o comando | Assinatura alinhada nos dois lados |\n| I-07 | Unitários | Teste instável | O teste escolhia uma conversa já resolvida | O teste escolhe uma conversa aberta |\n| I-08 | Páginas, com as chaves da Meta (10/10/2026) | Erro de hydration na página **Integrações** quando o WhatsApp real está habilitado (cenário de produção) | O endereço do webhook usava `window.location.origin` durante a renderização: vazio no servidor, preenchido no navegador | O endereço é preenchido depois de a página montar (`useEffect`). Página aprovada de novo |\n"},{"id":"Testes/resultados/api-seguranca.txt","section":"Resultados brutos","title":"api-seguranca.txt","markdown":"# api-seguranca.txt\n\n```text\nExecução: 10/10/2026 22:00 · servidor local com banco local (DATA_STORE=file, mesmas regras do Firestore), sem chaves da Meta\n\n✅ API-01 visitante vê só os planos — 3 planos; nenhuma empresa, usuário, conversa ou fatura\n✅ API-02 login: senha errada recusada; sessão HttpOnly — 401 com senha errada; cookie HttpOnly + SameSite=Lax\n✅ API-03 cada empresa vê só os próprios dados; ninguém recebe hash — Lumina: 12 conversas, 8 conteúdos; Aurora não vê nada da Lumina\n✅ API-04 backoffice vê empresas e faturas, mas não as conversas dos clientes finais — 13 empresas; 0 conversas (privacidade); sem hash\n✅ API-05 ações em dados de outra empresa ou fora do perfil são recusadas — 8 tentativas recusadas (422); sem login 401; ação inexistente 400\n✅ API-06 CSRF: alterações só a partir do próprio site — sem origem 403; outro site 403\n✅ API-07 simular mensagens só em conversas de demonstração; integrações sem chaves ficam fechadas — sem chaves da Meta: conexão real e webhook respondem 404\n\nResultado: 7/7 verificações aprovadas\n\n```\n"},{"id":"Testes/resultados/documentacao.txt","section":"Resultados brutos","title":"documentacao.txt","markdown":"# documentacao.txt\n\n```text\nExecução: 10/10/2026 22:08 · node tests/e2e/docs-check.mjs (link secreto local)\n\n✅ Documents/02-whatsapp-e-ia.md: 1/1 diagramas\n✅ Documents/03-arquitetura-e-seguranca.md: 1/1 diagramas\n✅ Documents/04-modelo-de-dados.md: 2/2 diagramas\n✅ Testes/REA do\n✅ WA-04 mensagem real: conversa nova, IA responde e envia pela API — resposta \"Claro! A avaliação inicial custa R$ 120 e esse val…\" enviada (wamid.TESTE1)\n✅ WA-05 notificação repetida não duplica (mesmo wamid) — 1 mensagem, 1 envio\n✅ WA-06 status de entrega: entregue e lida (nunca volta para trás) — sent → delivered → read (fora de ordem ignorado)\n✅ WA-07 cliente pede atendente: transferência; equipe responde pela API — transferida; equipe assumiu e a resposta foi enviada\n✅ WA-08 falha da Meta (fora das 24 h) aparece na mensagem e no painel — “Mais de 24 h desde a última mensagem do cliente: só é possível enviar um modelo aprovado.”\n✅ WA-09 mídia e números desconhecidos — áudio vira aviso para a equipe; número de outra conta é ignorado\n✅ WA-10 desconectar apaga o token — desconectado; mensagens novas não são enviadas\n\nResultado: 10/10 verificações do WhatsApp aprovadas\n\n```\n"}];
  mermaid.initialize({ startOnLoad: false, theme: "base", themeVariables: { primaryColor: "#eef2ff", primaryBorderColor: "#3157e8", primaryTextColor: "#17203b", lineColor: "#7790ed", fontFamily: "system-ui" } });
  const renderer = new marked.Renderer();
  const baseCode = renderer.code.bind(renderer);
  renderer.code = (code, lang) => lang === "mermaid" ? '<pre class="mermaid">' + code.replace(/</g, "&lt;") + "</pre>" : baseCode(code, lang);
  const nav = document.getElementById("nav"), article = document.getElementById("doc");
  let current;
  const normalize = (fromId, href) => {
    const parts = fromId.split("/").slice(0, -1).concat(href.split("/"));
    const out = [];
    for (const p of parts) { if (p === "..") out.pop(); else if (p && p !== ".") out.push(p); }
    return out.join("/");
  };
  const resolve = (fromId, href) => {
    const id = normalize(fromId, href);
    return docs.some((d) => d.id === id) ? id : docs.some((d) => d.id === id + "/README.md") ? id + "/README.md" : null;
  };
  async function show(id) {
    const doc = docs.find((d) => d.id === id) ?? docs[0];
    current = doc.id;
    article.innerHTML = marked.parse(doc.markdown, { renderer });
    nav.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.id === doc.id));
    await mermaid.run({ nodes: article.querySelectorAll(".mermaid") });
    history.replaceState(null, "", "#" + encodeURIComponent(doc.id));
    window.scrollTo(0, 0);
  }
  let lastSection;
  for (const d of docs) {
    if (d.section !== lastSection) { const h = document.createElement("h2"); h.textContent = d.section; nav.append(h); lastSection = d.section; }
    const b = document.createElement("button"); b.textContent = d.title; b.dataset.id = d.id; b.onclick = () => show(d.id); nav.append(b);
  }
  article.addEventListener("click", (e) => {
    const a = e.target.closest("a"); if (!a) return;
    const href = a.getAttribute("href") || "";
    if (/^https?:/.test(href)) { a.target = "_blank"; return; }
    const target = resolve(current, href.split("#")[0]);
    if (target) { e.preventDefault(); show(target); return; }
    // Outros arquivos do projeto (ex.: resultados/*.txt): caminho relativo a Documents/.
    a.href = "../" + normalize(current, href);
    a.target = "_blank";
  });
  show(decodeURIComponent(location.hash.slice(1)) || docs[0].id);
</script>
